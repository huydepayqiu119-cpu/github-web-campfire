name: Watchdog

on:
  workflow_run:
    workflows: ["Run Web Campfire"]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: watchdog
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      actions: write
    steps:
      - name: Cleanup old watchdog runs
        env:
          GH_TOKEN: ${{ secrets.WEBCAMPFIRE }}
          OWNER: huydepayqiu119-cpu
          REPO: github-web-campfire
        run: |
          curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/$OWNER/$REPO/actions/workflows/watchdog.yml/runs?status=completed&per_page=100" | python3 -c "import json,sys; [print(r['id']) for r in json.load(sys.stdin).get('workflow_runs',[])]" | while read id; do
            curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/$OWNER/$REPO/actions/runs/$id" > /dev/null && echo "Deleted $id"
          done

      - name: Check and trigger run-server if not running
        env:
          GH_TOKEN: ${{ secrets.WEBCAMPFIRE }}
          OWNER: huydepayqiu119-cpu
          REPO: github-web-campfire
          WORKFLOW: run-server.yml
        run: |
          RUNNING=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/$OWNER/$REPO/actions/workflows/$WORKFLOW/runs?per_page=5" | python3 -c "import json,sys; runs=json.load(sys.stdin).get('workflow_runs',[]); print(sum(1 for r in runs if r['status'] in ('in_progress','queued','waiting','requested','pending')))")
          echo "Active runs: $RUNNING"
          if [ "$RUNNING" = "0" ]; then
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/$OWNER/$REPO/actions/workflows/$WORKFLOW/dispatches" -d '{"ref":"main"}'
            echo "Triggered at $(date)"
          else
            echo "Already running, skipping"
          fi
